name: Fast Deploy (Local)

on:
  push:
    branches-ignore:
      - main
  workflow_dispatch:
    inputs:
      image_tag:
        description: Optional tag suffix for local testing
        required: false
        default: test

jobs:
  build-deploy:
    runs-on: self-hosted
    env:
      IMAGE_NAME: tg-claude
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build image locally
        run: |
          TAG_INPUT="${{ inputs.image_tag }}"
          if [ -n "$TAG_INPUT" ]; then
            IMAGE_TAG="${TAG_INPUT}-${GITHUB_SHA::7}"
          else
            IMAGE_TAG="${GITHUB_SHA::7}"
          fi
          echo "IMAGE_TAG=$IMAGE_TAG" >> "$GITHUB_ENV"
          mkdir -p /var/lib/buildx-cache
          docker buildx build \
            --load \
            -t "${IMAGE_NAME}:${IMAGE_TAG}" \
            --build-arg COMMIT_HASH="${GITHUB_SHA}" \
            --cache-from type=local,src=/var/lib/buildx-cache \
            --cache-to type=local,dest=/var/lib/buildx-cache-new,mode=min \
            .

      - name: Move cache
        run: |
          rm -rf /var/lib/buildx-cache
          mv /var/lib/buildx-cache-new /var/lib/buildx-cache

      - name: Sync docker-compose.yml to deploy path
        run: |
          cp docker-compose.yml "${{ secrets.DEPLOY_PATH }}/"

      - name: Deploy on runner host
        run: |
          cd "${{ secrets.DEPLOY_PATH }}"
          export DOCKER_IMAGE="${IMAGE_NAME}:${IMAGE_TAG}"
          docker compose up -d --no-build
          docker compose ps
          docker compose logs --tail=20
